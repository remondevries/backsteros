<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BacksterOS Development</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f1114;
        --fg: #e8eaed;
        --muted: #9aa0a6;
        --accent: #7dd3c0;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f4f5f7;
          --fg: #1a1d21;
          --muted: #5f6368;
          --accent: #0f766e;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      }
      main {
        min-height: 100%;
        display: grid;
        place-content: center;
        gap: 0.75rem;
        text-align: center;
        padding: 2rem;
      }
      .titlebar-drag {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 44px;
        -webkit-app-region: drag;
        app-region: drag;
      }
      h1 {
        margin: 0;
        font-size: 1.15rem;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: 0.9rem;
      }
      .spinner {
        width: 1.25rem;
        height: 1.25rem;
        margin: 0.35rem auto 0.15rem;
        border: 2px solid color-mix(in srgb, var(--muted) 35%, transparent);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="titlebar-drag" data-tauri-drag-region aria-hidden="true"></div>
    <main>
      <div class="spinner" aria-hidden="true"></div>
      <h1>BacksterOS Development</h1>
      <p id="status">Starting local console…</p>
    </main>
    <script>
      window.__setStatus = (text) => {
        const el = document.getElementById("status");
        if (el) el.textContent = text;
      };
    </script>
  </body>
</html>
