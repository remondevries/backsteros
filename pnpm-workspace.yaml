packages:
  - core/server
  - core/packages/*
  - mobile
  - desktop
  - desktop/packages/*
  - hub
allowBuilds:
  '@clerk/shared': true
  '@journeyapps/wa-sqlite': true
  '@swc/core': true
  browser-tabs-lock: true
  bufferutil: true
  core-js: true
  esbuild: true
  expo-libghostty: true
  node-pty: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: true
# Single React for Expo mobile (SDK 54) — clerk can otherwise pull a second React.
overrides:
  react: 19.1.0
  react-dom: 19.1.0
  '@types/react': 19.1.10
# Worklets Babel plugin requires these at runtime but only declares @babel/core.
packageExtensions:
  react-native-worklets:
    dependencies:
      '@babel/generator': ^7.27.0
      '@babel/traverse': ^7.27.0
      '@babel/types': ^7.27.0
