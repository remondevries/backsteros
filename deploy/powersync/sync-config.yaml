# PowerSync sync streams — Tier A/B metadata for BacksterOS.
# Includes: projects, tasks, documents (index), organizations, contacts,
# areas, letters (metadata), avatars (index), mentions, workspace_settings,
# bank_accounts, financial_categories, financial_goals, financial_recurrings,
# cashflow_planner_entries, habits, meetings, task_comments, task_activities,
# contact_relationships, crm_relationship_labels, crm_groups, crm_group_members, crm_activities.
# Never Tier C/D (PDF bytes, full markdown bodies, financial_transactions) —
# see docs/03-data-model.md.
# Soft-deleted rows are included so clients receive tombstones.

config:
  edition: 3

streams:
  workspace:
    auto_subscribe: true
    queries:
      - SELECT id, key, name, summary, description, organization_id, area_id, area, start_date, due_date, icon, color, type, github_repository, local_working_directory, status, priority, sort_order, created_at, updated_at, deleted_at FROM projects WHERE workspace_id = auth.parameter('workspace_id')
      - SELECT id, project_id, contact_id, assignee_id, related_contact_ids, related_organization_ids, number, title, description, status, priority, sort_order, due_date, due_end_date, triaged_at, inbox, links, agent_chat_id, linked_commit_shas, habit_id, completed_at, agent_created_at, agent_inbox_approved_at, inbox_updated_at, tracked_minutes, tracked_duration_seconds, created_at, updated_at, deleted_at FROM tasks WHERE workspace_id = auth.parameter('workspace_id')
      - SELECT id, type, project_id, parent_id, kind, icon, sort_order, journal_date, path, title, storage_key, content_type, byte_size, checksum, snippet, content_version, content_etag, created_at, updated_at, deleted_at FROM documents WHERE workspace_id = auth.parameter('workspace_id')
      - SELECT id, number, key, name, summary, phone, email, emails, phones, website, address, city, postal_code, country, region, latitude, longitude, size, social_accounts, chamber_of_commerce, tax_number, avatar_storage_key, avatar_content_type, sort_order, notes, moneybird_contact_id, created_at, updated_at, deleted_at FROM organizations WHERE workspace_id = auth.parameter('workspace_id')
      - SELECT id, number, key, organization_id, name, first_name, last_name, email, emails, title, summary, avatar_storage_key, avatar_content_type, sort_order, phone, phones, role, notes, address, city, postal_code, country, region, latitude, longitude, social_accounts, birthday, languages, created_at, updated_at, deleted_at FROM contacts WHERE workspace_id = auth.parameter('workspace_id')
      - SELECT id, name, parent, icon, color, sort_order, created_at, updated_at, deleted_at FROM areas WHERE workspace_id = auth.parameter('workspace_id')
      - SELECT id, number, project_id, organization_id, contact_id, title, icon, context, status, due_date, received_date, direction, storage_key, original_filename, content_type, byte_size, checksum, content_etag, sort_order, created_at, updated_at, deleted_at FROM letters WHERE workspace_id = auth.parameter('workspace_id')
      - SELECT id, entity_type, entity_id, content_type, byte_size, checksum, content_etag, created_at, updated_at FROM avatars WHERE workspace_id = auth.parameter('workspace_id')
      - SELECT id, user_id, source_type, source_id, excerpt, read_at, created_at FROM mentions WHERE workspace_id = auth.parameter('workspace_id')
      - SELECT workspace_id AS id, settings, updated_at FROM workspace_settings WHERE workspace_id = auth.parameter('workspace_id')
      - SELECT id, key, name, iban_or_mask, currency, type, avatar_storage_key, avatar_content_type, color, moneybird_financial_account_id, moneybird_last_synced_at, sort_order, created_at, updated_at, deleted_at FROM bank_accounts WHERE workspace_id = auth.parameter('workspace_id')
      - SELECT id, name, parent_id, kind, listing, icon, budget_cents, sort_order, created_at, updated_at, deleted_at FROM financial_categories WHERE workspace_id = auth.parameter('workspace_id')
      - SELECT id, name, listing, icon, goal_amount_cents, start_date, end_date, contribution_cents, saving_mode, sort_order, created_at, updated_at, deleted_at FROM financial_goals WHERE workspace_id = auth.parameter('workspace_id')
      - SELECT id, name, icon, category_id, amount_cents, next_date, archived, sort_order, created_at, updated_at, deleted_at FROM financial_recurrings WHERE workspace_id = auth.parameter('workspace_id')
      - SELECT id, entry_type, name, amount_cents, due_date, group_label, sort_order, created_at, updated_at, deleted_at FROM cashflow_planner_entries WHERE workspace_id = auth.parameter('workspace_id')
      - SELECT id, title, icon, description, project_id, cadence, cadence_anchor_ymd, sort_order, created_at, updated_at, deleted_at FROM habits WHERE workspace_id = auth.parameter('workspace_id')
      - SELECT id, number, title, summary, notes, transcription, status, format, location, location_organization_id, project_id, organization_id, attendee_contact_ids, start_at, end_at, tracked_minutes, tracked_duration_seconds, inbox_updated_at, sort_order, created_at, updated_at, deleted_at FROM meetings WHERE workspace_id = auth.parameter('workspace_id')
      - SELECT id, task_id, parent_comment_id, author_user_id, author_contact_id, author_email, body, resolved_at, created_at, updated_at, deleted_at FROM task_comments WHERE workspace_id = auth.parameter('workspace_id')
      - SELECT id, task_id, type, actor_user_id, actor_contact_id, actor_email, actor_name, data, created_at FROM task_activities WHERE workspace_id = auth.parameter('workspace_id')
      - SELECT id, from_contact_id, to_contact_id, type, note, created_at, updated_at, deleted_at FROM contact_relationships WHERE workspace_id = auth.parameter('workspace_id')
      - SELECT id, side_a_label, side_a_slug, side_b_label, side_b_slug, color, sort_order, created_at, updated_at, deleted_at FROM crm_relationship_labels WHERE workspace_id = auth.parameter('workspace_id')
      - SELECT id, name, description, color, icon, sort_order, created_at, updated_at, deleted_at FROM crm_groups WHERE workspace_id = auth.parameter('workspace_id')
      - SELECT id, group_id, subject_type, subject_id, created_at, updated_at, deleted_at FROM crm_group_members WHERE workspace_id = auth.parameter('workspace_id')
      - SELECT id, subject_type, subject_id, kind, body, body_preview, meeting_id, occurred_at, created_by, created_at, updated_at, deleted_at FROM crm_activities WHERE workspace_id = auth.parameter('workspace_id')
