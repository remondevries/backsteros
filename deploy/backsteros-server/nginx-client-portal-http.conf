# Client portal — HTTP proxy (Cloudflare terminates TLS at edge).
# After origin DNS points here, site works immediately.
# Optional: certbot for Full (strict): certbot certonly --webroot -w /var/www/certbot \
#   -d client.lemo-design.com -d client.lemo-design.nl

server {
    listen 80;
    listen [::]:80;
    server_name client.lemo-design.com client.lemo-design.nl;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
