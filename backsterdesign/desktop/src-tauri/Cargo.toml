[package]
name = "backsterdesign-desktop"
version = "0.1.0"
description = "BacksterDESIGN — Tauri desktop shell for Penpot"
authors = ["BacksterOS"]
edition = "2021"
autobins = false

[[bin]]
name = "BacksterDESIGN"
path = "src/main.rs"

[lib]
name = "backsterdesign_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-quartz-core = { version = "0.3", features = ["objc2-core-graphics"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
