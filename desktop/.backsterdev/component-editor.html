<!DOCTYPE html>
<html lang="en" class="light" style="color-scheme:light;background-color:#f4f4f5">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light" />
<title>Component editor</title>
<!-- component-editor:framework=vanilla -->
<!-- component-editor:canvas=#f4f4f5 -->
<!-- component-editor:appearance=light -->
<script>(function(){var dark=false;var native=window.matchMedia.bind(window);window.matchMedia=function(query){if(typeof query==="string"&&query.indexOf("prefers-color-scheme")!==-1){var matches=/prefers-color-scheme:\s*dark/.test(query)?dark:/prefers-color-scheme:\s*light/.test(query)?!dark:native(query).matches;return{matches:matches,media:query,onchange:null,addListener:function(){},removeListener:function(){},addEventListener:function(){},removeEventListener:function(){},dispatchEvent:function(){return false;}};}return native(query);};})();</script>
<style id="component-editor-canvas">html,body{height:100%;min-height:100%;margin:0;background-color:#f4f4f5}#component-editor-stage{box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100%;width:100%;padding:2rem;gap:1.5rem}</style>
<style id="component-editor-css">
html, body {
  margin: 0;
  min-height: 100%;
  background: #f4f4f5;
  font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
}

/* Standalone logo tile — left radius only (card-rail fit) */
.logo-tile {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 240px;
  height: 240px;
  background: #d13732;
  border: none;
  outline: none;
  box-shadow: none;
  border-radius: 24px 0 0 24px;
}

.logo-tile svg {
  display: block;
  width: 148px;
  height: 148px;
}

/* In-card preview: logo rail flush into body, no outer dashes */
.card {
  display: flex;
  align-items: stretch;
  width: min(100%, 28rem);
  border: none;
  outline: none;
  box-shadow: none;
  border-radius: 10px 0 0 10px;
  background: #fff;
  overflow: hidden;
}

.card__logo {
  display: flex;
  flex-shrink: 0;
  align-items: center;
  justify-content: center;
  width: 3.5rem;
  background: #d13732;
  border: none;
  border-radius: 10px 0 0 10px;
}

.card__logo svg {
  display: block;
  width: 1.75rem;
  height: 1.75rem;
}

.card__body {
  display: flex;
  flex: 1;
  flex-direction: column;
  justify-content: center;
  gap: 0.15rem;
  min-width: 0;
  padding: 0.75rem 0.9rem;
}

.card__title {
  margin: 0;
  font-size: 0.875rem;
  font-weight: 600;
  color: #18181b;
}

.card__description {
  margin: 0;
  font-size: 0.75rem;
  line-height: 1.4;
  color: rgb(24 24 27 / 0.55);
}
</style>
</head>
<body style="color-scheme:light;background-color:#f4f4f5">
<div id="component-editor-stage">
<!-- component-editor:body -->
<div class="logo-tile" aria-label="Twilio">
  <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" width="64" height="64">
    <g transform="translate(0 .047) scale(.93704)" fill="#ffffff">
      <path d="M34.1 0C15.3 0 0 15.3 0 34.1s15.3 34.1 34.1 34.1C53 68.3 68.3 53 68.3 34.1S53 0 34.1 0zm0 59.3C20.3 59.3 9 48 9 34.1 9 20.3 20.3 9 34.1 9 48 9 59.3 20.3 59.3 34.1 59.3 48 48 59.3 34.1 59.3z"/>
      <circle cx="42.6" cy="25.6" r="7.1"/>
      <circle cx="42.6" cy="42.6" r="7.1"/>
      <circle cx="25.6" cy="42.6" r="7.1"/>
      <circle cx="25.6" cy="25.6" r="7.1"/>
    </g>
  </svg>
</div>

<div class="card">
  <div class="card__logo" aria-hidden="true">
    <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" width="64" height="64">
      <g transform="translate(0 .047) scale(.93704)" fill="#ffffff">
        <path d="M34.1 0C15.3 0 0 15.3 0 34.1s15.3 34.1 34.1 34.1C53 68.3 68.3 53 68.3 34.1S53 0 34.1 0zm0 59.3C20.3 59.3 9 48 9 34.1 9 20.3 20.3 9 34.1 9 48 9 59.3 20.3 59.3 34.1 59.3 48 48 59.3 34.1 59.3z"/>
        <circle cx="42.6" cy="25.6" r="7.1"/>
        <circle cx="42.6" cy="42.6" r="7.1"/>
        <circle cx="25.6" cy="42.6" r="7.1"/>
        <circle cx="25.6" cy="25.6" r="7.1"/>
      </g>
    </svg>
  </div>
  <div class="card__body">
    <p class="card__title">Twilio</p>
    <p class="card__description">Messaging, voice, and verification APIs.</p>
  </div>
</div>
<!-- /component-editor:body -->
</div>
</body>
</html>
