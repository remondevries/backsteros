<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/app-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BacksterOS</title>
    <!--
      Critical boot styles: paint the branded loading screen before JS/CSS
      bundles arrive so the native WebView never flashes white.
      Matches SignInLoadingScreen (app chrome is dark-first).
      Overlay webviews strip this splash (see inline script below).
    -->
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      html {
        color-scheme: dark;
        background: #0a0a0a;
        color: #ededed;
      }

      body {
        background: inherit;
        color: inherit;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      }

      .boot-splash {
        display: flex;
        min-height: 100%;
        align-items: center;
        justify-content: center;
        padding: 32px 24px;
        background:
          radial-gradient(
            ellipse 80% 60% at 50% 0%,
            rgb(255 255 255 / 0.06),
            transparent 70%
          ),
          #0a0a0a;
        color: #ededed;
      }

      .boot-splash__panel {
        display: flex;
        width: 100%;
        max-width: 420px;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        text-align: center;
      }

      .boot-splash__brand {
        margin: 0;
        font-size: 28px;
        font-weight: 650;
        letter-spacing: -0.03em;
      }

      .boot-splash__copy {
        margin: 0 0 8px;
        color: rgb(255 255 255 / 0.55);
        line-height: 1.5;
      }

      /* Transparent compose / command-palette overlay webview */
      html.boot-overlay,
      html.boot-overlay body,
      html.boot-overlay #root {
        background: transparent !important;
        color-scheme: normal;
      }

      html.boot-overlay .boot-splash {
        display: none !important;
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div class="boot-splash" id="boot-splash" role="status" aria-live="polite">
        <div class="boot-splash__panel">
          <h1 class="boot-splash__brand">BacksterOS</h1>
          <p class="boot-splash__copy">Loading session…</p>
        </div>
      </div>
    </div>
    <script>
      // Overlay windows must stay transparent — never flash the boot splash.
      if (location.pathname.startsWith("/desktop-overlay")) {
        document.documentElement.classList.add("boot-overlay");
        document.getElementById("boot-splash")?.remove();
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
