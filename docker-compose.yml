# Default project name is worktree-safe. Live LaunchAgent / ensure-once export
# BACKSTEROS_COMPOSE_PROJECT=backsteros (+ COMPOSE_PROJECT_NAME) so plain
# `docker compose up` from a checkout cannot recreate live containers.
name: ${BACKSTEROS_COMPOSE_PROJECT:-backsteros-worktree}

services:
  postgres:
    image: postgres:17-alpine
    container_name: ${BACKSTEROS_COMPOSE_PROJECT:-backsteros-worktree}-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-backsteros}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-backsteros}
      POSTGRES_DB: ${POSTGRES_DB:-backsteros}
    volumes:
      - backsteros_pg_data:/var/lib/postgresql/data
      - ./deploy/powersync/init-local.sql:/docker-entrypoint-initdb.d/99-powersync.sql:ro
    command: ["postgres", "-c", "wal_level=logical"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backsteros -d backsteros"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    container_name: ${BACKSTEROS_COMPOSE_PROJECT:-backsteros-worktree}-powersync-mongo
    restart: unless-stopped
    # PowerSync bucket storage needs transactions → single-node replica set.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - backsteros_powersync_mongo:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:\"rs0\",members:[{_id:0,host:\"mongo:27017\"}]}).ok }" | grep 1',
        ]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 5s

  powersync:
    image: journeyapps/powersync-service:latest
    container_name: ${BACKSTEROS_COMPOSE_PROJECT:-backsteros-worktree}-powersync
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    command: ["start", "-r", "unified"]
    environment:
      POWERSYNC_CONFIG_PATH: /config/service.yaml
    volumes:
      - ./deploy/powersync/service.local.yaml:/config/service.yaml:ro
      - ./deploy/powersync/sync-config.yaml:/config/sync-config.yaml:ro
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  # Tie volume names to the compose project so worktree stacks never mount (or
  # `down -v`) the live volumes. Live LaunchAgent exports
  # BACKSTEROS_COMPOSE_PROJECT=backsteros → backsteros_backsteros_pg_data.
  backsteros_pg_data:
    name: ${BACKSTEROS_COMPOSE_PROJECT:-backsteros-worktree}_backsteros_pg_data
  backsteros_powersync_mongo:
    name: ${BACKSTEROS_COMPOSE_PROJECT:-backsteros-worktree}_backsteros_powersync_mongo
